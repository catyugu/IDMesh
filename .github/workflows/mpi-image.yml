name: MPI CI image

on:
  push:
    branches: [main]
    paths:
      - .github/docker/mpi/Dockerfile
      - .github/workflows/mpi-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: publish / OpenMPI environment
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/mpi/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/catyugu/idmesh-ci-mpi:ubuntu24.04-v1
          labels: |
            org.opencontainers.image.source=https://github.com/catyugu/IDMesh
            org.opencontainers.image.description=Pinned system toolchain for IDMesh MPI CI
      - name: Record immutable image reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/catyugu/idmesh-ci-mpi@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
