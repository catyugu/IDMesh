name: MPI Kokkos benchmark

# Same-runner baseline for persistent mirror/layout changes.

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Baseline commit, tag, or branch
        required: true
        default: 51fc5b7a0295f3573e73d778a6be1fb7879abce8
      candidate_ref:
        description: Candidate commit, tag, or branch
        required: true
        default: main

permissions:
  contents: read
  packages: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/catyugu/idmesh-ci-mpi@sha256:8b7239500b857f196f6a40e51841f461dd14c76fffffbe3c447d173e52eecdc9
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      OMPI_MCA_rmaps_base_oversubscribe: "1"
      OMPI_ALLOW_RUN_AS_ROOT: "1"
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.baseline_ref }}
          path: baseline
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref }}
          path: current

      - name: Configure and build both revisions
        shell: bash
        run: |
          set -euxo pipefail
          for revision in baseline current; do
            cmake -S "$revision" -B "$revision/build" -DCMAKE_BUILD_TYPE=Release \
              -DIDMESH_BUILD_BENCHMARKS=ON -DIDMESH_BUILD_TESTS=OFF \
              -DIDMESH_ENABLE_MPI=ON -DIDMESH_ENABLE_KOKKOS=ON
            cmake --build "$revision/build" --target idmesh_mpi_kokkos_benchmark --parallel 2
          done

      - name: Run same-runner comparison
        shell: bash
        run: |
          set -euo pipefail
          : > benchmark.log

          run_once() {
            local revision="$1"
            local side="$2"
            local components="$3"
            local ghosts="$4"
            local iterations="$5"
            local repeat="$6"
            echo "CASE revision=${revision} side=${side} components=${components} ghosts=${ghosts} repeat=${repeat}" | tee -a benchmark.log
            mpirun -n 2 --bind-to none "$revision/build/benchmarks/idmesh_mpi_kokkos_benchmark" \
              --side "$side" --components "$components" \
              --ghost-layers "$ghosts" --iterations "$iterations" | tee -a benchmark.log
          }

          for spec in "128 1 1 300" "256 8 1 300" "256 8 4 300"; do
            read -r side components ghosts iterations <<< "$spec"

            for revision in baseline current; do
              mpirun -n 2 --bind-to none "$revision/build/benchmarks/idmesh_mpi_kokkos_benchmark" \
                --side "$side" --components "$components" \
                --ghost-layers "$ghosts" --iterations 50 >/dev/null
            done

            for repeat in 1 2 3 4 5; do
              if (( repeat % 2 )); then
                run_once baseline "$side" "$components" "$ghosts" "$iterations" "$repeat"
                run_once current "$side" "$components" "$ghosts" "$iterations" "$repeat"
              else
                run_once current "$side" "$components" "$ghosts" "$iterations" "$repeat"
                run_once baseline "$side" "$components" "$ghosts" "$iterations" "$repeat"
              fi
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: mpi-kokkos-benchmark-comparison
          path: benchmark.log
          retention-days: 30
