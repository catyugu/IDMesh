name: Real engineering validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch immutable engineering fixture
        run: python3 validation/fetch_meshes.py --tier ci
      - name: Build and install SDK
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DIDMESH_BUILD_TESTS=OFF -DIDMESH_BUILD_EXAMPLES=OFF
          cmake --build build --parallel 2
          cmake --install build --prefix install
      - name: Build independent consumer
        run: |
          cmake -S validation/consumer -B build-validation \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/install"
          cmake --build build-validation --parallel 2
      - name: Convert authenticated Pantheon ZIP to native Gmsh binary
        run: |
          python3 validation/convert_adventure.py \
            --archive validation/data/adventure-pantheon.zip \
            --output validation/data/adventure-pantheon.msh \
            --report validation/results/pantheon-conversion.json
      - name: Run 1.33M-tet patch, conservation, and VTU round-trip
        run: |
          mkdir -p validation/results
          ./build-validation/idmesh_thermal \
            --mesh validation/data/adventure-pantheon.msh --problem patch \
            --max-iterations 4000 \
            --validate-topology \
            --output-vtu validation/results/pantheon-patch.vtu \
            --report validation/results/pantheon-patch.json
      - name: Run 1.33M-tet physical heat conduction
        run: |
          ./build-validation/idmesh_thermal \
            --mesh validation/data/adventure-pantheon.msh --problem heat \
            --max-iterations 6000 \
            --report validation/results/pantheon-heat.json
      - name: Verify published cell counts on both solves
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for case in ('patch', 'heat'):
              data = json.loads(Path(f'validation/results/pantheon-{case}.json').read_text())
              assert data['cells'] == 1329027, data
              assert data['vertices'] == 273157, data
              assert data['free_dofs'] > 0, data
          PY
      - name: Probe induction-heating engineering mesh (candidate)
        run: |
          python3 validation/fetch_meshes.py --tier manual
          ./build-validation/idmesh_thermal \
            --mesh validation/data/mfem-induction-heating.msh --problem patch \
            --report validation/results/induction-patch.json
      - name: Probe LFS mechanical bracket at scale (candidate)
        run: |
          python3 validation/fetch_meshes.py --tier candidate
          python3 -m venv .venv-mesh-converter
          .venv-mesh-converter/bin/python -m pip install 'meshio==5.3.5'
          .venv-mesh-converter/bin/python -c 'import meshio; src="validation/data/meshioplusplus-example.msh"; dst="validation/data/bracket-ascii.msh"; meshio.write(dst, meshio.read(src), file_format="gmsh22", binary=False)'
          ./build-validation/idmesh_thermal \
            --mesh validation/data/bracket-ascii.msh --problem patch \
            --max-iterations 4000 \
            --output-vtu validation/results/bracket-patch.vtu \
            --report validation/results/bracket-patch.json
          ./build-validation/idmesh_thermal \
            --mesh validation/data/bracket-ascii.msh --problem heat \
            --max-iterations 4000 \
            --report validation/results/bracket-heat.json
      - name: Upload machine-readable reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-engineering-validation
          path: validation/results/*.json
          if-no-files-found: warn
