name: Diagnose Pantheon fixture

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect downloaded archive without extracting
        run: |
          python3 - <<'PY'
          import urllib.request, io, zipfile, hashlib
          url = 'https://adventure.sys.t.u-tokyo.ac.jp/download/sample_data/pantheon_b60cmc.zip'
          with urllib.request.urlopen(url, timeout=90) as response:
              raw = response.read()
          print('archive size:', len(raw), 'sha256:', hashlib.sha256(raw).hexdigest(), flush=True)
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              for m in z.infolist():
                  print('entry:', repr(m.filename), 'size:', m.file_size,
                        'compressed:', m.compress_size, flush=True)
              members = [m for m in z.infolist() if not m.is_dir()]
              if len(members) != 1: raise RuntimeError('unexpected zip contents')
              with z.open(members[0]) as f:
                  def read_int():
                      line = f.readline()
                      if not line: raise RuntimeError('premature EOF')
                      return int(line)
                  first = f.readline()
                  print('first line:', repr(first), flush=True)
                  second = f.readline()
                  print('second line:', repr(second), flush=True)
                  elements = int(second)
                  for i in range(elements):
                      line = f.readline()
                      if i in {0, 1, elements-2, elements-1}:
                          print('tet:', i,repr(line[:150]),flush=True)
                  nodes = read_int()
                  print('nodes:', nodes,flush=True)
                  for i in range(nodes):
                      line=f.readline()
                      if i in {0,1,nodes-1}:
                          print('node:',i,repr(line[:150]),flush=True)
                  for i in range(8):
                      line=f.readline()
                      print('footer:',i,repr(line[:150]),flush=True)
          PY
