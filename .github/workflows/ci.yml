name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned clang-format
        run: python3 -m pip install clang-format==19.1.7
      - name: Verify tracked C++ sources
        run: bash scripts/check-format.sh

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DIDMESH_BUILD_TESTS=ON -DIDMESH_BUILD_BENCHMARKS=OFF
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install
        run: cmake --install build --config Release --prefix install
      - name: Installed package consumer
        run: cmake -S tests/consumer -B consumer-build -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install
      - name: Build consumer
        run: cmake --build consumer-build --config Release

  kokkos-serial:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure Kokkos Serial
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DIDMESH_ENABLE_KOKKOS=ON -DIDMESH_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install Kokkos SDK
        run: cmake --install build --prefix install-kokkos
      - name: Build external Kokkos consumer
        run: cmake -S tests/consumer -B consumer-kokkos -DCMAKE_PREFIX_PATH=$PWD/install-kokkos && cmake --build consumer-kokkos --parallel 2

  mpi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenMPI
        run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin
      - name: Configure MPI
        run: cmake -S . -B build-mpi -DCMAKE_BUILD_TYPE=Release -DIDMESH_ENABLE_MPI=ON -DIDMESH_BUILD_TESTS=ON
      - name: Build MPI and examples
        run: cmake --build build-mpi --parallel 2
      - name: Test MPI with two and three ranks
        env:
          OMPI_MCA_rmaps_base_oversubscribe: "1"
        run: ctest --test-dir build-mpi --output-on-failure
      - name: Install MPI SDK
        run: cmake --install build-mpi --prefix install-mpi
      - name: Build external MPI consumer
        run: cmake -S tests/consumer -B consumer-mpi -DCMAKE_PREFIX_PATH=$PWD/install-mpi && cmake --build consumer-mpi --parallel 2

  examples:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Basix test dependency
        run: python -m pip install fenics-basix==0.11.0 numpy
      - name: Configure three standalone examples
        run: cmake -S . -B build-examples -DCMAKE_BUILD_TYPE=Release -DIDMESH_BUILD_TESTS=ON -DIDMESH_BUILD_EXAMPLES=ON -DIDMESH_TEST_BASIX=ON -DPython3_EXECUTABLE=$(command -v python)
      - name: Build basix_orientation, FVM and FEM
        run: cmake --build build-examples --target idmesh_basix_orientation idmesh_fvm idmesh_fem --parallel 2
      - name: Run all three examples
        run: ctest --test-dir build-examples --output-on-failure -R '^idmesh[.]example[.](basix_orientation|fvm|fem)$'

  mpi-kokkos-serial:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MPI runtime and headers
        run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin
      - name: Configure combined MPI/Kokkos backend
        run: cmake -S . -B build-joint -DCMAKE_BUILD_TYPE=Release -DIDMESH_ENABLE_MPI=ON -DIDMESH_ENABLE_KOKKOS=ON -DIDMESH_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build-joint --parallel 2
      - name: Run MPI device-halo tests
        env:
          OMPI_MCA_rmaps_base_oversubscribe: "1"
        run: ctest --test-dir build-joint --output-on-failure
      - name: Install combined SDK
        run: cmake --install build-joint --prefix install-joint
      - name: Verify external combined SDK consumer
        run: cmake -S tests/consumer -B consumer-joint -DCMAKE_PREFIX_PATH=$PWD/install-joint && cmake --build consumer-joint --parallel 2
