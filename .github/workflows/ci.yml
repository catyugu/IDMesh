name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    name: native / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-24.04
            sdk_name: IDMesh-linux-gcc-Release
            shared: OFF
          - name: windows-msvc
            os: windows-2022
            sdk_name: IDMesh-windows-msvc-Release
            shared: OFF
          - name: macos-clang
            os: macos-15
            sdk_name: IDMesh-macos-clang-Release
            shared: OFF
          - name: linux-gcc-shared
            os: ubuntu-24.04
            sdk_name: IDMesh-linux-gcc-shared-Release
            shared: ON
          - name: windows-msvc-shared
            os: windows-2022
            sdk_name: IDMesh-windows-msvc-shared-Release
            shared: ON
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DIDMESH_BUILD_TESTS=ON -DIDMESH_BUILD_BENCHMARKS=OFF -DBUILD_SHARED_LIBS=${{ matrix.shared }}
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install
        run: cmake --install build --config Release --prefix install
      - name: Configure installed-package consumer
        run: cmake -S tests/consumer -B consumer-build -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install
      - name: Build installed-package consumer
        run: cmake --build consumer-build --config Release
      - name: Upload installed SDK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.sdk_name }}
          path: install
          if-no-files-found: error
          retention-days: 30

  linux-backends:
    name: backend / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: kokkos-serial
            build_dir: build-kokkos
            install_dir: install-kokkos
            cmake_args: -DIDMESH_ENABLE_KOKKOS=ON
            needs_mpi: false
          - name: mpi
            build_dir: build-mpi
            install_dir: install-mpi
            cmake_args: -DIDMESH_ENABLE_MPI=ON
            needs_mpi: true
          - name: mpi-kokkos-serial
            build_dir: build-joint
            install_dir: install-joint
            cmake_args: -DIDMESH_ENABLE_MPI=ON -DIDMESH_ENABLE_KOKKOS=ON
            needs_mpi: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenMPI
        if: matrix.needs_mpi
        run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin
      - name: Configure
        run: cmake -S . -B ${{ matrix.build_dir }} -DCMAKE_BUILD_TYPE=Release -DIDMESH_BUILD_TESTS=ON ${{ matrix.cmake_args }}
      - name: Build
        run: cmake --build ${{ matrix.build_dir }} --parallel 2
      - name: Test
        env:
          OMPI_MCA_rmaps_base_oversubscribe: "1"
        run: ctest --test-dir ${{ matrix.build_dir }} --output-on-failure
      - name: Install SDK
        run: cmake --install ${{ matrix.build_dir }} --prefix ${{ matrix.install_dir }}
      - name: Verify external consumer
        run: cmake -S tests/consumer -B consumer-${{ matrix.name }} -DCMAKE_PREFIX_PATH=$PWD/${{ matrix.install_dir }} && cmake --build consumer-${{ matrix.name }} --parallel 2

  examples:
    name: examples / basix
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Basix test dependency
        run: python3 -m venv .venv && .venv/bin/python -m pip install fenics-basix==0.11.0 numpy
      - name: Configure examples
        run: cmake -S . -B build-examples -DCMAKE_BUILD_TYPE=Release -DIDMESH_BUILD_TESTS=ON -DIDMESH_BUILD_EXAMPLES=ON -DIDMESH_TEST_BASIX=ON -DPython3_EXECUTABLE=$PWD/.venv/bin/python
      - name: Build examples
        run: cmake --build build-examples --target idmesh_basix_orientation idmesh_fvm idmesh_fem --parallel 2
      - name: Run examples
        run: ctest --test-dir build-examples --output-on-failure -R '^idmesh[.]example[.](basix_orientation|fvm|fem)$'
