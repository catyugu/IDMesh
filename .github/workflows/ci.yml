name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    name: native / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-24.04
            sdk_name: IDMesh-linux-gcc-Release
            shared: OFF
          - name: windows-msvc
            os: windows-2022
            sdk_name: IDMesh-windows-msvc-Release
            shared: OFF
          - name: macos-clang
            os: macos-15
            sdk_name: IDMesh-macos-clang-Release
            shared: OFF
          - name: linux-gcc-shared
            os: ubuntu-24.04
            sdk_name: IDMesh-linux-gcc-shared-Release
            shared: ON
          - name: windows-msvc-shared
            os: windows-2022
            sdk_name: IDMesh-windows-msvc-shared-Release
            shared: ON
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DIDMESH_BUILD_TESTS=ON -DIDMESH_BUILD_BENCHMARKS=OFF -DBUILD_SHARED_LIBS=${{ matrix.shared }}
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install
        run: cmake --install build --config Release --prefix install
      - name: Configure installed-package consumer
        run: cmake -S tests/consumer -B consumer-build -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install
      - name: Build installed-package consumer
        run: cmake --build consumer-build --config Release
      - name: Upload installed SDK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.sdk_name }}
          path: install
          if-no-files-found: error
          retention-days: 30


  linux-backends:
    name: backend / kokkos-serial
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-kokkos -DCMAKE_BUILD_TYPE=Release -DIDMESH_BUILD_TESTS=ON -DIDMESH_ENABLE_KOKKOS=ON
      - name: Build
        run: cmake --build build-kokkos --parallel 2
      - name: Test
        run: ctest --test-dir build-kokkos --output-on-failure
      - name: Install SDK
        run: cmake --install build-kokkos --prefix install-kokkos
      - name: Verify external consumer
        run: cmake -S tests/consumer -B consumer-kokkos -DCMAKE_PREFIX_PATH="$PWD/install-kokkos" && cmake --build consumer-kokkos --parallel 2

  mpi-backends:
    name: backend / MPI-only + MPI-Kokkos
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    # Prebuilt by mpi-image.yml; no apt operations in ordinary CI runs.
    # Update this digest after intentionally rebuilding the image.
    container:
      image: ghcr.io/catyugu/idmesh-ci-mpi@sha256:8b7239500b857f196f6a40e51841f461dd14c76fffffbe3c447d173e52eecdc9
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      OMPI_MCA_rmaps_base_oversubscribe: "1"
      OMPI_ALLOW_RUN_AS_ROOT: "1"
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Check MPI toolchain
        run: cmake --version && mpicxx --version && mpirun --version

      - name: Configure MPI-only
        run: cmake -S . -B build-mpi -DCMAKE_BUILD_TYPE=Release -DIDMESH_BUILD_TESTS=ON -DIDMESH_ENABLE_MPI=ON
      - name: Build MPI-only
        run: cmake --build build-mpi --parallel 2
      - name: Test MPI-only
        run: ctest --test-dir build-mpi --output-on-failure
      - name: Install and verify MPI-only SDK
        run: |
          cmake --install build-mpi --prefix install-mpi
          cmake -S tests/consumer -B consumer-mpi -DCMAKE_PREFIX_PATH="$PWD/install-mpi"
          cmake --build consumer-mpi --parallel 2

      - name: Configure MPI + Kokkos (Serial)
        run: cmake -S . -B build-mpi-kokkos -DCMAKE_BUILD_TYPE=Release -DIDMESH_BUILD_TESTS=ON -DIDMESH_ENABLE_MPI=ON -DIDMESH_ENABLE_KOKKOS=ON
      - name: Build MPI + Kokkos
        run: cmake --build build-mpi-kokkos --parallel 2
      - name: Test MPI + Kokkos
        run: ctest --test-dir build-mpi-kokkos --output-on-failure
      - name: Install and verify MPI + Kokkos SDK
        run: |
          cmake --install build-mpi-kokkos --prefix install-mpi-kokkos
          cmake -S tests/consumer -B consumer-mpi-kokkos -DCMAKE_PREFIX_PATH="$PWD/install-mpi-kokkos"
          cmake --build consumer-mpi-kokkos --parallel 2

  examples:
    name: examples / basix
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Basix test dependency
        run: python3 -m venv .venv && .venv/bin/python -m pip install fenics-basix==0.11.0 numpy
      - name: Configure examples
        run: cmake -S . -B build-examples -DCMAKE_BUILD_TYPE=Release -DIDMESH_BUILD_TESTS=ON -DIDMESH_BUILD_EXAMPLES=ON -DIDMESH_TEST_BASIX=ON -DPython3_EXECUTABLE=$PWD/.venv/bin/python
      - name: Build examples
        run: cmake --build build-examples --target idmesh_basix_orientation idmesh_fvm idmesh_fem --parallel 2
      - name: Run examples
        run: ctest --test-dir build-examples --output-on-failure -R '^idmesh[.]example[.](basix_orientation|fvm|fem)$'
