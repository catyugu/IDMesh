name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DIDMESH_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Benchmark smoke
        if: runner.os == 'Linux'
        run: ./build/idmesh_benchmark 8 2
      - name: Install
        run: cmake --install build --config Release --prefix install
      - name: Installed package consumer
        run: cmake -S tests/consumer -B consumer-build -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install
      - name: Build consumer
        run: cmake --build consumer-build --config Release

  kokkos-serial:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure Kokkos Serial
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DIDMESH_ENABLE_KOKKOS=ON -DIDMESH_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  mpi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenMPI
        run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin
      - name: Configure MPI
        run: cmake -S . -B build-mpi -DCMAKE_BUILD_TYPE=Release -DIDMESH_ENABLE_MPI=ON -DIDMESH_BUILD_TESTS=ON
      - name: Build MPI and examples
        run: cmake --build build-mpi --parallel 2
      - name: Test MPI with two and three ranks
        run: ctest --test-dir build-mpi --output-on-failure
